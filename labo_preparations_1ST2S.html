<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Labo des Préparations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Patrick+Hand&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Mise en page « Carnet de labo » : page de cahier quadrillé avec marge rouge, énoncé écrit sur le papier,
   « À retenir » en post-it et calculatrice à droite (empilés sous l'énoncé sur téléphone).
   Signature : la réponse s'écrit sur une ligne soulignée à l'encre bleue. */
:root{
  --paper:#fbfbf6; --grid:#dde5ee; --margin:#e8848a;
  --surface:#ffffff; --ink:#1f2a44; --muted:#56627a; --line:#9aa8bd;
  --accent:#2a4d9b; --accent-ink:#ffffff; --tint:#e9eef7;
  --postit:#fff1a6; --postit-ink:#4a3d0e; --postit-title:#b8372f;
  --calcdisp:#e9eef5;
  --ok:#2f7d4f; --ok-bg:#e3f2e8; --ko:#b23c36; --ko-bg:#fbe6e4; --warn:#8a5a00; --warn-bg:#fff2d4;
  --f-title:"Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  --f-body:"Atkinson Hyperlegible", Verdana, Arial, sans-serif;
  --f-num:"JetBrains Mono", Consolas, ui-monospace, monospace;
  --fs:18px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#151b29; --grid:#212a3d; --margin:#9c4a55;
  --surface:#1c2436; --ink:#e4e8f2; --muted:#a3adc2; --line:#3a4560;
  --accent:#8fb0ff; --accent-ink:#0d1730; --tint:#243052;
  --postit:#3f381c; --postit-ink:#f1e6b5; --postit-title:#ff9d8f;
  --calcdisp:#10151f;
  --ok:#6fcf97; --ok-bg:#15301f; --ko:#f08a80; --ko-bg:#3a1c1a; --warn:#f0b74c; --warn-bg:#382a10;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.6;font-variant-numeric:tabular-nums;min-height:100vh}
body::after{content:"";position:fixed;top:0;bottom:0;left:max(10px,calc((100vw - 1100px)/2 - 10px));width:2px;background:var(--margin);z-index:-1;pointer-events:none}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{border-bottom:2px dashed var(--line)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
h1{font-family:var(--f-title);font-weight:400;font-size:2.1em;line-height:1;margin:0;color:var(--accent);text-wrap:balance}
.sub{color:var(--muted);font-size:.8em;margin:2px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stars{font-family:var(--f-title);font-size:1.4em;color:var(--accent);margin-right:8px;letter-spacing:.06em}
.stars .off{color:var(--line)}
.stars .small{font-size:.75em}
button{font:inherit;color:inherit;cursor:pointer}
.tbtn{background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.8em}
.tbtn[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent);border-radius:8px;padding:10px 22px;font-weight:700}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--accent);font-weight:400}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,label.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
main{padding-block:22px 56px}
h2{font-family:var(--f-title);font-weight:400;font-size:1.9em;line-height:1.1;margin:0 0 8px;color:var(--accent);text-wrap:balance}
h3{font-family:var(--f-body);font-weight:700;font-size:1.05em;margin:0 0 6px}
p{margin:0 0 10px}
.enonce p{text-align:justify;hyphens:auto}
.muted{color:var(--muted)}
.small{font-size:.85em}
/* Accueil */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:20px;box-shadow:0 2px 0 var(--grid)}
.form{display:grid;gap:14px;max-width:460px}
.form label{display:grid;gap:4px;font-weight:700}
.form input,.form select{font:inherit;font-weight:400;padding:9px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:16px}
.mcard{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 0 var(--grid)}
.mcard h3{font-family:var(--f-title);font-weight:400;font-size:1.5em;line-height:1.1;color:var(--accent);margin:0}
.mcard.locked{opacity:.55}
.mnum{font-family:var(--f-num);font-size:.75em;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pill{align-self:flex-start;font-size:.75em;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--tint);color:var(--ink)}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.lock{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.mcard .btn{margin-top:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sendzone{margin-top:22px;display:grid;gap:10px}
.status{font-size:.88em;padding:8px 12px;border-radius:6px}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.ko{background:var(--ko-bg);color:var(--ko)}
.status.wait{background:var(--tint)}
/* Mission */
.mtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:2px dashed var(--line);background:transparent}
.dot.cur{border:3px solid var(--accent)}
.dot.ok{background:var(--ok);border:2px solid var(--ok)}
.dot.ko{background:var(--ko);border:2px solid var(--ko)}
.dot.ok2{background:var(--warn);border:2px solid var(--warn)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr);gap:28px}}
.qcard{display:grid;gap:16px;min-width:0}
.qcard>*{min-width:0}
.ask{font-weight:700}
.doc{min-width:0}
.doc-t{display:inline-block;border:1.5px solid var(--ink);border-bottom:none;padding:2px 12px;font-weight:700;font-size:.85em;background:var(--surface)}
.doc-c{border:1.5px solid var(--ink);padding:10px 14px;overflow-x:auto;background:var(--surface);font-size:.92em}
aside{display:grid;gap:26px;min-width:0}
.retenir{background:var(--postit);color:var(--postit-ink);padding:16px 20px 18px;transform:rotate(-1.2deg);box-shadow:0 6px 14px rgba(40,32,8,.18)}
.retenir h3{font-family:var(--f-title);font-weight:400;font-size:1.6em;line-height:1;color:var(--postit-title);margin:0 0 8px}
.retenir p{font-size:.88em}
.formule{font-family:var(--f-num);font-weight:700;font-size:1.25em;padding:2px 0;display:block;margin:4px 0 8px;overflow-x:auto}
.lcdlab{font-family:var(--f-title);font-size:1.4em;line-height:1;color:var(--accent);margin-bottom:4px;display:block}
.lcd{display:flex;align-items:baseline;gap:12px;border-bottom:3px solid var(--accent);padding:2px 2px 4px}
.lcd input{flex:1;min-width:0;width:0;background:transparent;border:none;color:var(--accent);font-family:var(--f-num);font-weight:500;font-size:1.7em;letter-spacing:.02em}
.lcd input:focus{outline:none}
.lcd:focus-within{outline:3px solid var(--accent);outline-offset:4px;border-radius:2px}
.lcd input::placeholder{color:var(--line)}
.lcd input:disabled{color:var(--ink)}
.lcd .u{color:var(--muted);font-family:var(--f-num);font-size:1.2em;white-space:nowrap}
.lcd.flash{animation:flash .9s ease-out}
@keyframes flash{0%{background:var(--tint)}100%{background:transparent}}
.hintline{font-size:.8em;color:var(--muted);margin:6px 0 0}
fieldset{border:none;margin:0;padding:0;display:grid;gap:8px}
legend{padding:0;margin-bottom:6px;font-weight:700}
label.opt{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
label.opt input{width:1.1em;height:1.1em;accent-color:var(--accent);flex:none}
label.opt:has(input:checked){border-color:var(--accent);background:var(--tint)}
label.opt.good{border-color:var(--ok);background:var(--ok-bg)}
label.opt.bad{border-color:var(--ko);background:var(--ko-bg)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.method{background:var(--surface);border:1.5px dashed var(--accent);border-radius:8px;padding:12px 16px}
.method b{font-family:var(--f-title);font-weight:400;font-size:1.3em;color:var(--accent)}
.method ol{margin:6px 0 0;padding-left:1.3em}
.method li{margin-bottom:4px}
.fb{border-radius:8px;padding:12px 16px;border:2px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.ko{background:var(--ko-bg);border-color:var(--ko)}
.cswarn{margin:10px 0 0;padding:8px 12px;border-radius:6px;background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn)}
.fb.retry{background:var(--warn-bg);border-color:var(--warn)}
.fb.retry .verdict{color:var(--warn)}
.fb .verdict{font-family:var(--f-title);font-size:1.45em;line-height:1.1}
.fb.ok .verdict{color:var(--ok)}
.fb.ko .verdict{color:var(--ko)}
.corr{margin-top:8px;line-height:1.9}
.corr .l{display:block;overflow-x:auto}
.score{font-family:var(--f-title);font-size:4.5em;color:var(--accent);line-height:1}
sub,sup{font-size:.72em;line-height:0}
.calc{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}
.calc h3{margin:0;font-family:var(--f-title);font-weight:400;font-size:1.4em;line-height:1;color:var(--accent)}
.cdisp{background:var(--calcdisp);border-radius:6px;padding:8px 12px;display:grid;gap:2px}
.cdisp .hist{color:var(--muted);font-family:var(--f-num);font-size:.75em;text-align:right;min-height:1.2em;overflow-x:auto;white-space:nowrap}
.cdisp input{background:transparent;border:none;color:var(--ink);font-family:var(--f-num);font-size:1.25em;text-align:right;width:100%;min-width:0}
.cdisp input:focus{outline:none}
.cdisp:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.ckeys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ck{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 0;font-family:var(--f-num);font-weight:500;font-size:.95em;color:var(--ink)}
.ck.op{background:var(--tint)}
.ck.eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);grid-column:span 4;font-weight:700}
.ck:active{transform:translateY(1px)}
.cerr{color:var(--ko);font-size:.8em;min-height:1.2em;margin:0}
.cinfo{color:var(--ok);font-size:.8em;margin:0}
.cerr:empty,.cinfo:empty{display:none}
/* Lecture facilitée */
body.ease{letter-spacing:.04em;word-spacing:.16em;line-height:1.85}
body.ease .enonce p{text-align:left;hyphens:none}
@media (prefers-reduced-motion:no-preference){.qcard,.fb{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
@media (prefers-reduced-motion:reduce){.retenir{transform:none}.lcd.flash{animation:none}}
</style>
</head>

<script>
/* ================== Réglages ================== */
const WORKER = "https://resultatpolenord.lud-tek.workers.dev/";
const JEU = "calculs_quantite_matiere_1st2s";
const KEY = "labo_preparations_1st2s_v1";
const NQ = 5, PASS = 4;
const nq = k => MISSIONS[k].plan.length;
const passOf = k => MISSIONS[k].pass||PASS;
const TEST = (typeof location!=="undefined") && /[?&]test=1/.test(location.search);

/* ================== Outils ================== */
const pick = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const cap = s => s[0].toUpperCase()+s.slice(1);
const nb = s => String(s).replace(/[  ]/g," ");
function fz(x,sig){
  if(Number.isInteger(x)&&Math.abs(x)>=10) return nb(x.toLocaleString("fr-FR"));
  const a=Math.abs(x);
  if(a<0.01){let e=Math.floor(Math.log10(a));let m=(x/Math.pow(10,e)).toPrecision(sig);if(Math.abs(+m)>=10){e++;m=(x/Math.pow(10,e)).toPrecision(sig)}return m.replace(".",",")+" × 10<sup>"+e+"</sup>";}
  return x.toPrecision(sig).replace(".",",");
}
/* valeur d'énoncé : garde au moins 2 chiffres significatifs */
function fv(x){x=+x.toPrecision(6);const sig=Math.max(2,x.toExponential().split("e")[0].replace(/[-.]/g,"").length);return fz(x,sig);}
/* résultat : 3 chiffres significatifs */
function fmt(x,sig=3){
  if(x===0) return "0";
  const a=Math.abs(x);
  if(a>=0.01&&a<1e5) return nb(Number(x.toPrecision(sig)).toLocaleString("fr-FR",{maximumFractionDigits:8}));
  let e=Math.floor(Math.log10(a)), m=Number((x/Math.pow(10,e)).toPrecision(sig));
  if(Math.abs(m)>=10){m/=10;e++}
  return nb(m.toLocaleString("fr-FR",{maximumFractionDigits:8}))+" × 10<sup>"+e+"</sup>";
}
const f1 = x => x.toFixed(1).replace(".",",");
/* écriture avec un nombre imposé de chiffres significatifs (les zéros finaux sont gardés) */
function fs(x,sig){
  if(x===0) return "0";
  const r=Number(x.toPrecision(sig));const e=Math.floor(Math.log10(Math.abs(r)));
  if(Math.abs(r)<0.001||e>=sig){
    const m=(r/Math.pow(10,e)).toFixed(sig-1).replace(".",",");
    return m+" × 10<sup>"+(e<0?"−"+(-e):e)+"</sup>";
  }
  let t=r.toFixed(Math.max(0,sig-1-e));
  let [ip,dp]=t.split(".");ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return dp?ip+","+dp:ip;
}
/* nombre de chiffres significatifs d'un nombre écrit (les zéros finaux comptent) */
function cs(str){
  let t=String(str).replace(/<sup>.*?<\/sup>/g,"").replace(/\s+/g,"").replace(/[−–]/g,"-").replace(/,/g,".");
  t=t.replace(/[x×*]10\^?.*$/i,"").replace(/e.*$/i,"").replace(/^[-+]/,"");
  const d=t.replace(".","").replace(/^0+/,"");
  return d.replace(/[^0-9]/g,"").length;
}

const vol = v => v.toFixed(1).replace(".",",");
function qcm(choices,correct){const idx=shuffle(choices.map((_,i)=>i));return {type:"qcm",choices:idx.map(i=>choices[i]),correct:idx.indexOf(correct)};}

/* ================== Chimie ================== */
const ATOM={H:1.0,C:12.0,N:14.0,O:16.0,Na:23.0,Cl:35.5};
const DE_EL={H:"d'hydrogène",C:"de carbone",N:"d'azote",O:"d'oxygène",Na:"de sodium",Cl:"de chlore"};
function parse(f){const r=[];f.replace(/([A-Z][a-z]?)(\d*)/g,(_,e,n)=>{r.push([e,n?+n:1]);return ""});return r;}
const molarM = f => Math.round(parse(f).reduce((s,[e,n])=>s+n*ATOM[e],0)*10)/10;
const fH = f => f.replace(/(\d+)/g,"<sub>$1</sub>");
const MOLS=[
 {n:"eau",f:"H2O",de:"de l'eau",d:"constituant principal du corps humain"},
 {n:"glucose",f:"C6H12O6",de:"du glucose",d:"sucre transporté par le sang"},
 {n:"dioxyde de carbone",f:"CO2",de:"du dioxyde de carbone",d:"gaz rejeté lors de l'expiration"},
 {n:"éthanol",f:"C2H6O",de:"de l'éthanol",d:"alcool des gels hydroalcooliques"},
 {n:"urée",f:"CH4N2O",de:"de l'urée",d:"déchet azoté éliminé dans l'urine"},
 {n:"acide ascorbique",f:"C6H8O6",de:"de l'acide ascorbique",d:"vitamine C"},
 {n:"paracétamol",f:"C8H9NO2",de:"du paracétamol",d:"médicament contre la douleur et la fièvre"},
 {n:"aspirine",f:"C9H8O4",de:"de l'aspirine",d:"médicament anti-inflammatoire"},
 {n:"ibuprofène",f:"C13H18O2",de:"de l'ibuprofène",d:"médicament anti-inflammatoire"},
 {n:"caféine",f:"C8H10N4O2",de:"de la caféine",d:"stimulant présent dans le café"},
 {n:"saccharose",f:"C12H22O11",de:"du saccharose",d:"sucre de table"},
 {n:"acide lactique",f:"C3H6O3",de:"de l'acide lactique",d:"produit par les muscles pendant l'effort"},
 {n:"glycérol",f:"C3H8O3",de:"du glycérol",d:"présent dans les crèmes hydratantes"},
 {n:"chlorure de sodium",f:"NaCl",de:"du chlorure de sodium",d:"sel du sérum physiologique"},
 {n:"hydrogénocarbonate de sodium",f:"NaHCO3",de:"de l'hydrogénocarbonate de sodium",d:"bicarbonate utilisé contre les brûlures d'estomac"},
 {n:"peroxyde d'hydrogène",f:"H2O2",de:"du peroxyde d'hydrogène",d:"eau oxygénée, antiseptique"},
 {n:"ammoniac",f:"NH3",de:"de l'ammoniac",d:"présent dans certains produits ménagers"},
 {n:"acide éthanoïque",f:"C2H4O2",de:"de l'acide éthanoïque",d:"acide du vinaigre"},
 {n:"hydroxyde de sodium",f:"NaOH",de:"de l'hydroxyde de sodium",d:"soude des déboucheurs de canalisations"}
];
const molByName = n => MOLS.find(m=>m.n===n);
const part = mo => (/^[aeéèiouyh]/i.test(mo.n)?"d'":"de ")+mo.n;
const dP = x => (/^[aeéèiouyh]/i.test(x)?"d'":"de ")+x;
const deS = s => s.replace(/^une /,"d'une ").replace(/^un /,"d'un ").replace(/^du /,"de ");
function dataAtoms(f){
  const set=new Set(parse(f).map(a=>a[0]));["H","C","O"].forEach(e=>set.add(e));
  const order=["H","C","N","O","Na","Cl"];
  return "Masses molaires atomiques : "+order.filter(e=>set.has(e)).map(e=>`M(${e}) = ${f1(ATOM[e])} g/mol`).join(" ; ")+".";
}
function corrM(mo){
  const at=parse(mo.f);
  const sym=at.map(([e,n])=>(n>1?n+" × ":"")+`M(${e})`).join(" + ");
  const num=at.map(([e,n])=>(n>1?n+" × ":"")+f1(ATOM[e])).join(" + ");
  return `<span class="l">M(${fH(mo.f)}) = ${sym}</span><span class="l">M(${fH(mo.f)}) = ${num} = <b>${f1(molarM(mo.f))} g/mol</b></span>`;
}
const ACT=["Un technicien de laboratoire","Une technicienne de laboratoire","Un préparateur en pharmacie","Une préparatrice en pharmacie","Une infirmière","Un infirmier","Une élève de ST2S en TP","Un élève de ST2S en TP"];
const PRENOMS=["Inès","Lucas","Yanis","Chloé","Malik","Emma","Sofia","Noah"];
const Cme="C<sub>mère</sub>", Cfi="C<sub>fille</sub>", Vme="V<sub>mère</sub>", Vfi="V<sub>fille</sub>", Cmass="C<sub>m</sub>";

/* ================== Mission 1 : masse molaire ================== */
const G1={
 M(){
  const mo=pick(MOLS.filter(x=>parse(x.f).length>1));const M=molarM(mo.f);const at=parse(mo.f);
  const naive=Math.round(at.reduce((s,[e])=>s+ATOM[e],0)*10)/10;
  return {type:"num",ctx:`<b>${cap(mo.n)}</b> : ${mo.d}. Sa formule brute est ${fH(mo.f)}.`,data:dataAtoms(mo.f),
   ask:`Calculer la masse molaire moléculaire M ${mo.de}.`,unit:"g/mol",ans:M,noSig:true,show:f1(M),rel:0.012,
   traps:naive!==M?[[naive,"Tu as additionné les masses molaires atomiques sans les multiplier par le nombre d'atomes de chaque élément."]]:[],
   corr:corrM(mo)};
 },
 count(){
  const mo=pick(MOLS.filter(x=>!x.f.includes("Na")&&parse(x.f).some(a=>a[1]>1)));
  const at=parse(mo.f);const [e,n]=pick(at.filter(a=>a[1]>1));
  const tot=at.reduce((s,a)=>s+a[1],0);
  const opts=[n];[tot,n+1,n>2?n-1:n+2,...at.map(a=>a[1]),n+3].forEach(v=>{if(opts.length<4&&!opts.includes(v))opts.push(v)});
  const q=qcm(opts.map(String),0);
  return {...q,ctx:`<b>${cap(mo.n)}</b> : ${mo.d}. Sa formule brute est ${fH(mo.f)}.`,
   ask:`Combien d'atomes ${DE_EL[e]} contient une molécule ${part(mo)} ?`,
   corr:`<span class="l">Dans ${fH(mo.f)}, le chiffre écrit en indice après le symbole ${e} est ${n} : la molécule contient <b>${n} atomes ${DE_EL[e]}</b>.</span>`,
   method:["Repérer le symbole de l'élément dans la formule.","Lire le chiffre écrit en indice juste après ce symbole.","S'il n'y a pas de chiffre, il y a 1 seul atome."]};
 },
 expr(){
  const mo=pick(MOLS.filter(x=>parse(x.f).length>1&&parse(x.f).some(a=>a[1]>1)));
  const at=parse(mo.f);const tot=at.reduce((s,a)=>s+a[1],0);
  const good=at.map(([e,n])=>(n>1?n+" × ":"")+`M(${e})`).join(" + ");
  const w1=at.map(([e])=>`M(${e})`).join(" + ");
  const w2=at.map(([e,n])=>(n>1?n+" × ":"")+`M(${e})`).join(" × ");
  const w3=`${tot} × M(${at[0][0]})`;
  const q=qcm([good,w1,w2,w3].map(s=>`M = ${s}`),0);
  return {...q,ctx:`<b>${cap(mo.n)}</b> : ${mo.d}. Sa formule brute est ${fH(mo.f)}.`,
   ask:`Quelle expression permet de calculer la masse molaire moléculaire M ${mo.de} ?`,
   corr:`<span class="l">On multiplie chaque masse molaire atomique par le nombre d'atomes, puis on additionne : <b>M = ${good}</b>.</span>`};
 },
 sens(){
  const e=pick(["C","O","N","H"]);const nom={C:"carbone",O:"oxygène",N:"azote",H:"hydrogène"}[e];
  const q=qcm([`une mole d'atomes ${DE_EL[e]} a une masse de ${f1(ATOM[e])} g`,`un seul atome ${DE_EL[e]} a une masse de ${f1(ATOM[e])} g`,`${f1(ATOM[e])} g ${DE_EL[e]} ${ATOM[e]>=2?"contiennent":"contient"} ${ATOM[e]} atome${ATOM[e]>=2?"s":""}`,`un litre ${DE_EL[e]} a une masse de ${f1(ATOM[e])} g`],0);
  return {...q,ctx:`On lit dans les données : M(${e}) = ${f1(ATOM[e])} g/mol.`,ask:"Cette valeur signifie que :",
   corr:`<span class="l">La masse molaire est la masse d'<b>une mole</b> d'entités : une mole d'atomes ${DE_EL[e]} a une masse de ${f1(ATOM[e])} g. Un seul atome est beaucoup trop léger pour être pesé.</span>`,
   method:["La masse molaire est la masse d'une mole (et non d'un seul atome).","Son unité g/mol se lit « grammes par mole »."]};
 },
 unite(){
  const q=qcm(["g/mol","g/L","mol/L","g"],0);
  return {...q,ctx:"La masse molaire M d'une molécule est la masse d'une mole de ces molécules.",ask:"Quelle est l'unité de la masse molaire M ?",
   corr:`<span class="l">Une masse (en g) pour une mole : la masse molaire s'exprime en <b>g/mol</b>. Le g/L est l'unité de la concentration massique.</span>`,
   method:["La masse molaire est une masse divisée par une quantité de matière.","Masse en g, quantité de matière en mol."]};
 },
 check(){
  const mo=pick(MOLS.filter(x=>parse(x.f).some(a=>a[1]>1)));const M=molarM(mo.f);const at=parse(mo.f);
  const naive=Math.round(at.reduce((s,[e])=>s+ATOM[e],0)*10)/10;
  const [e]=pick(at);const plus=Math.round((M+ATOM[e])*10)/10;
  const right=Math.random()<.45;const shown=right?M:(naive!==M&&Math.random()<.6?naive:plus);
  const who=pick(PRENOMS);
  return {type:"qcm",choices:["Oui, le résultat est juste","Non, le résultat est faux"],correct:right?0:1,
   ctx:`${who} a calculé la masse molaire ${mo.de} (${fH(mo.f)}) et trouve M = ${f1(shown)} g/mol.`,data:dataAtoms(mo.f),
   ask:`Le résultat de ${who} est-il juste ?`,corr:corrM(mo)+(right?"":`<span class="l">${who} s'est trompé(e) : ${shown===naive?"les nombres d'atomes n'ont pas été pris en compte.":`un atome ${DE_EL[e]} a été compté en trop.`}</span>`)};

/* ================== Mission 2 : n = m / M ================== */
const sM = M => cs(f1(M));
const csNote = sig => `<span class="l small muted">Résultat arrondi à ${sig} chiffres significatifs, comme la donnée la moins précise.</span>`;
const PHR_M=["Au laboratoire, on pèse une masse m = {m} g {de}.","Un flacon contient une masse m = {m} g {de}.","On dispose d'un échantillon de masse m = {m} g {de}.","Une préparatrice pèse m = {m} g {de} sur une balance."];
const MASSES=[[0.90,2],[1.80,3],[2.5,2],[4.50,3],[5.0,2],[9.00,3],[10.0,3],[12,2],[18,2],[20.0,3],[25,2],[36,2],[45.0,3],[50,2],[100,3]];
const DRUGS=[["paracétamol",[500]],["aspirine",[300,500]],["ibuprofène",[200,400]],["acide ascorbique",[500]],["caféine",[100,200]]];
function nCorr(m,sm,M,sig,pre){return (pre||"")+`<span class="l">n = m / M = ${fs(m,sm)} / ${f1(M)}</span><span class="l">n = <b>${fs(m/M,sig)} mol</b></span>`+csNote(sig);}
const G2={
 N(atoms){
  const mo=pick(MOLS);const M=molarM(mo.f);const [m,sm]=pick(MASSES);const sig=Math.min(sm,sM(M));
  return {type:"num",ctx:pick(PHR_M).replace("{m}",fs(m,sm)).replace("{de}",part(mo))+` Formule brute : ${fH(mo.f)}.`,
   data:atoms?dataAtoms(mo.f):`Masse molaire ${mo.de} : M = ${f1(M)} g/mol.`,
   ask:atoms?`Calculer la masse molaire M ${mo.de}, puis la quantité de matière n ${part(mo)} contenue dans l'échantillon.`:`Calculer la quantité de matière n ${part(mo)} contenue dans l'échantillon.`,
   unit:"mol",ans:m/M,sig,rel:0.025,
   traps:[[m*M,"Tu as multiplié. La relation est n = m / M : on divise la masse par la masse molaire."],[M/m,"Tu as inversé la division : n = m / M (la masse en haut, la masse molaire en bas)."]],
   corr:nCorr(m,sm,M,sig,atoms?corrM(mo):""),
   method:atoms?["Calculer d'abord la masse molaire M en additionnant les masses molaires des atomes (sans oublier les nombres d'atomes).","Vérifier que la masse m est en grammes.","Appliquer n = m / M.","Écrire le résultat en mol."]:null};
 },
 Natoms(){return G2.N(true)},
 mg(){
  const [nom,doses]=pick(DRUGS);const mo=molByName(nom);const M=molarM(mo.f);const d=pick(doses);const m=d/1000;const sig=Math.min(3,sM(M));
  return {type:"num",ctx:`Un comprimé contient m = ${d} mg ${part(mo)} (${mo.d}), de formule ${fH(mo.f)}.`,
   data:`Masse molaire ${mo.de} : M = ${f1(M)} g/mol. Rappel : 1 g = 1 000 mg.`,
   ask:`Calculer la quantité de matière n ${part(mo)} contenue dans un comprimé.`,unit:"mol",ans:m/M,sig,rel:0.025,
   traps:[[d/M,`Convertis d'abord la masse en grammes : ${d} mg = ${fs(m,3)} g.`],[m*M,"Tu as multiplié : n = m / M."]],
   corr:`<span class="l">Conversion : m = ${d} mg = ${fs(m,3)} g</span>`+nCorr(m,3,M,sig),
   method:["Convertir la masse en grammes : on divise par 1 000 (1 g = 1 000 mg).","Appliquer n = m / M.","Écrire le résultat en mol."]};
 },
 formula(){
  if(Math.random()<.5){const q=qcm(["n = m / M","n = m × M","n = M / m","n = m + M"],0);
   return {...q,ctx:"On connaît la masse m d'un échantillon et la masse molaire M de l'espèce chimique.",ask:"Quelle relation permet de calculer la quantité de matière n ?",
    corr:`<span class="l"><b>n = m / M</b> : plus la masse est grande, plus il y a de matière ; plus les molécules sont lourdes, moins il y en a.</span>`};}
  const q=qcm(["n en mol, m en g, M en g/mol","n en g, m en mol, M en g/mol","n en mol, m en kg, M en mol/g","n en mol/L, m en g, M en g/L"],0);
  return {...q,ctx:"On utilise la relation n = m / M.",ask:"Quelles sont les unités à utiliser ?",corr:`<span class="l"><b>n en mol, m en g, M en g/mol</b> : g ÷ (g/mol) = mol.</span>`};
 },
 compare(){
  let a,b;do{a=pick(MOLS);b=pick(MOLS)}while(Math.abs(molarM(a.f)-molarM(b.f))<5);
  const Ma=molarM(a.f),Mb=molarM(b.f);const m=pick([10.0,20.0,50.0]);

  return {...q,ctx:`On pèse deux échantillons de même masse m = ${fs(m,3)} g : l'un ${part(a)} (${fH(a.f)}), l'autre ${part(b)} (${fH(b.f)}).`,
   data:`M(${fH(a.f)}) = ${f1(Ma)} g/mol ; M(${fH(b.f)}) = ${f1(Mb)} g/mol.`,
   ask:"Quel échantillon contient la plus grande quantité de matière ?",
   corr:`<span class="l">n(${fH(a.f)}) = ${fs(m,3)} / ${f1(Ma)} = ${fs(m/Ma,3)} mol</span><span class="l">n(${fH(b.f)}) = ${fs(m,3)} / ${f1(Mb)} = ${fs(m/Mb,3)} mol</span><span class="l">À masse égale, l'espèce qui a la plus petite masse molaire contient <b>le plus de moles</b>.</span>`,
   method:["Calculer n = m / M pour chaque échantillon.","Comparer les deux résultats."]};

};

/* ================== Mission 3 : m = n × M ================== */

 m(atoms){

   corr:mCorr(n,sn,M,sig,atoms?corrM(mo):""),
   method:atoms?["Calculer d'abord la masse molaire M (somme des masses des atomes).","Vérifier que n est en mol.","Appliquer m = n × M.","Écrire le résultat en g."]:null};
 },
 matoms(){return G3.m(true)},
 mmol(){
  const mo=pick(MOLS);const M=molarM(mo.f);const [nm,sn]=pick([[2.0,2],[5.0,2],[10,2],[20,2],[25,2],[50,2],[100,3],[250,3]]);const n=nm/1000;const sig=Math.min(sn,sM(M));
  return {type:"num",ctx:`Un dosage nécessite n = ${fs(nm,sn)} mmol ${part(mo)} (${fH(mo.f)}).`,data:`Masse molaire ${mo.de} : M = ${f1(M)} g/mol. Rappel : 1 mol = 1 000 mmol.`,

   traps:[[nm*M,`Convertis d'abord en mol : ${fs(nm,sn)} mmol = ${fs(n,sn)} mol.`],[n/M,"Pour passer de n à m, on multiplie : m = n × M."]],
   corr:`<span class="l">Conversion : n = ${fs(nm,sn)} mmol = ${fs(n,sn)} mol</span>`+mCorr(n,sn,M,sig),
   method:["Convertir la quantité de matière en mol : on divise par 1 000.","Appliquer m = n × M.","Écrire le résultat en g."]};
 },
 formula(){
  if(Math.random()<.5){const q=qcm(["m = n × M","m = n / M","m = M / n","m = n + M"],0);
   return {...q,ctx:"On connaît la quantité de matière n et la masse molaire M d'une espèce chimique.",ask:"Quelle relation permet de calculer la masse m à peser ?",

  const q=qcm(["en g","en mol","en g/mol","en g/L"],0);
  return {...q,ctx:"On calcule m = n × M avec n en mol et M en g/mol.",ask:"Le résultat s'exprime :",corr:`<span class="l">mol × g/mol = g : le résultat est une masse, <b>en g</b>.</span>`};
 },
 findmol(){
  let set;do{set=shuffle(MOLS.slice()).slice(0,4)}while(set.some((x,i)=>set.some((y,j)=>i<j&&Math.abs(molarM(x.f)-molarM(y.f))<6)));
  const t=set[0];const M=molarM(t.f);const n=pick([0.100,0.200,0.250,0.500]);const m=+(n*M).toPrecision(3);
  const q=qcm(set.map(x=>`${x.n} (${fH(x.f)})`),0);
  return {...q,ctx:`Au laboratoire, un flacon a perdu son étiquette. Un échantillon de masse m = ${fs(m,3)} g de son contenu correspond à une quantité de matière n = ${fs(n,3)} mol.`,
   data:set.slice().sort((x,y)=>molarM(x.f)-molarM(y.f)).map(x=>`M(${fH(x.f)}) = ${f1(molarM(x.f))} g/mol`).join(" ; ")+".",
   ask:"Calculer M = m / n, puis identifier l'espèce chimique contenue dans le flacon.",
   corr:`<span class="l">M = m / n = ${fs(m,3)} / ${fs(n,3)} = ${fs(m/n,3)} g/mol</span><span class="l">C'est <b>${t.n}</b> (${fH(t.f)}).</span>`,
   method:["Calculer M = m / n (on divise la masse par la quantité de matière).","Comparer le résultat aux masses molaires des données."]};

};

/* ================== Mission 4 : dilution ================== */

const COMBOS=[];PIP.forEach(p=>FIO.forEach(f=>{const F=f/p;if(Number.isInteger(F)&&F>=2&&F<=100)COMBOS.push({Vm:p,Vf:f,F})}));
const DIL=[
 {sol:"une solution mère de glucose",u:"g/L",cf:[2.00,5.00,10.0,20.0],max:400},
 {sol:"une solution antiseptique concentrée de chlorhexidine",u:"g/L",cf:[0.500,1.00,2.00,5.00],max:200},
 {sol:"une solution concentrée d'éosine",u:"g/L",cf:[1.00,2.00,5.00,10.0],max:200},
 {sol:"une solution de sulfate de cuivre",u:"mol/L",cf:[0.0100,0.0200,0.0500,0.100],max:1},
 {sol:"une solution d'acide chlorhydrique",u:"mol/L",cf:[0.0100,0.0200,0.0500,0.100],max:10},
 {sol:"une solution d'hydroxyde de sodium",u:"mol/L",cf:[0.0100,0.0500,0.100],max:5},
 {sol:"un bain de bouche concentré",u:"g/L",cf:[0.500,1.00,2.00],max:100},
 {sol:"une solution de chlorure de sodium",u:"g/L",cf:[1.00,2.00,4.50,9.00],max:300}
];
const sVf = v => v>=1000?4:3;
const vF = v => fs(v,sVf(v));
function dcase(noLitre){
  let c,d,Cf,Cm;do{c=pick(COMBOS);d=pick(DIL);Cf=pick(d.cf);Cm=+(Cf*c.F).toPrecision(6)}while(Cm>d.max||(noLitre&&c.Vf>=1000));

}
const G4={
 F(){

  return {type:"num",ctx:`${k.act} dispose ${deS(k.d.sol)} de concentration ${Cme} = ${fs(k.Cm,3)} ${k.d.u}. Il faut préparer une solution fille de concentration ${Cfi} = ${fs(k.Cf,3)} ${k.d.u}.`,
   ask:"Calculer le facteur de dilution F.",unit:"(sans unité)",ans:k.F,noSig:true,show:String(k.F),rel:0.02,
   traps:[[1/k.F,`F = ${Cme} / ${Cfi} : on divise la plus grande concentration par la plus petite, F est toujours plus grand que 1.`]],
   corr:`<span class="l">F = ${Cme} / ${Cfi} = ${fs(k.Cm,3)} / ${fs(k.Cf,3)}</span><span class="l">F = <b>${k.F}</b> (la solution est diluée ${k.F} fois)</span>`};
 },

   ask:`Calculer le volume ${Vme} de solution mère à prélever.`,unit:"mL",ans:k.Vm,sig:3,rel:0.02,

   corr:`<span class="l">${Vme} = ${Vfi} / F = ${vF(k.Vf)} / ${k.F}</span><span class="l">${Vme} = <b>${fs(k.Vm,3)} mL</b></span>`+csNote(3),
   method:[`Repérer ${Vfi} et F.`,`Appliquer ${Vme} = ${Vfi} / F.`,`${Vme} est dans la même unité que ${Vfi} (ici en mL).`]};
 },
 Vm(){
  const k=dcase();
  return {type:"num",ctx:`${k.act} doit préparer ${Vfi} = ${vF(k.Vf)} mL de solution de concentration ${Cfi} = ${fs(k.Cf,3)} ${k.d.u} à partir ${deS(k.d.sol)} de concentration ${Cme} = ${fs(k.Cm,3)} ${k.d.u}.`,
   ask:`Calculer le facteur de dilution F, puis le volume ${Vme} de solution mère à prélever.`,unit:"mL",ans:k.Vm,sig:3,rel:0.02,
   traps:[[k.Vf*k.F,`Le volume prélevé est plus petit que ${Vfi} : on divise ${Vfi} par F.`],[k.F,`${k.F} est le facteur de dilution. Il reste à calculer ${Vme} = ${Vfi} / F.`]],
   corr:`<span class="l">F = ${Cme} / ${Cfi} = ${fs(k.Cm,3)} / ${fs(k.Cf,3)} = ${k.F}</span><span class="l">${Vme} = ${Vfi} / F = ${vF(k.Vf)} / ${k.F} = <b>${fs(k.Vm,3)} mL</b></span>`+csNote(3)};
 },

 },
 pip(){

  return {...q,ctx:`Pour préparer une solution fille, il faut prélever précisément ${Vme} = ${fs(k.Vm,3)} mL ${deS(k.d.sol)}.`,

   corr:`<span class="l">Pour prélever un volume précis, on utilise <b>une pipette jaugée de ${k.Vm} mL</b> (avec une propipette). Le bécher et l'éprouvette ne sont pas assez précis.</span>`};
 },

 }
};

/* ================== Mission 5 : dissolution ================== */
const DIS=[

function buildQs(k){
  const mi=MISSIONS[k];const used=new Set();S.vues=S.vues||{};
  return mi.plan.map(slot=>{
    const pool=shuffle(BANK.filter(q=>q.mission===k&&q.slot===slot&&!used.has(q.id)));
    pool.sort((a,b)=>(S.vues[a.id]||0)-(S.vues[b.id]||0));
    const q=pool[0];used.add(q.id);S.vues[q.id]=(S.vues[q.id]||0)+1;
    return JSON.parse(JSON.stringify(q));
  });
}

/* ================== Saisie et correction ================== */
function parseNum(s){
  if(!s) return NaN;
  s=String(s).trim().replace(/\s+/g,"").replace(/,/g,".").replace(/[−–]/g,"-");
  s=s.replace(/[x×*]10\^?\(?([-+]?\d+)\)?/i,"e$1").replace(/^10\^\(?([-+]?\d+)\)?/,"1e$1");
  const m=s.match(/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/i);
  return m?parseFloat(m[0]):NaN;
}
const close=(v,a,rel)=>Math.abs(v-a)<=Math.abs(a)*rel+1e-12;
function judgeNum(q,v){
  if(close(v,q.ans,q.rel)) return {ok:true};
  for(const [val,msg] of (q.traps||[])) if(close(v,val,0.03)) return {ok:false,msg};
  if(close(v,q.ans*1000,0.03)||close(v,q.ans/1000,0.03)) return {ok:false,msg:"Ton résultat est 1 000 fois trop grand ou trop petit : vérifie les conversions d'unités (g et mg, L et mL, mol et mmol)."};
  if(close(v,q.ans,0.12)) return {ok:false,msg:"Tu es proche : vérifie les valeurs utilisées et ton arrondi."};
  return {ok:false};
}

/* ================== Suivi d'activité ================== */
let outAt=null, run=null;
function goOut(){if(outAt)return;outAt=Date.now();S.act.sorties++;if(run&&!run.locked)run.outDuring=true;save();}
function comeBack(){if(!outAt)return;S.act.horsMs+=Date.now()-outAt;outAt=null;save();}
function median(a){if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y);const h=Math.floor(s.length/2);return s.length%2?s[h]:(s[h-1]+s[h])/2;}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function startMission(k){
  if(!unlocked(k))return;

  renderQ();window.scrollTo(0,0);
}

function showMethod(auto){

  if(!b.hidden){b.innerHTML=`<div class="method"><b>Méthode</b><ol>${steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>`;
    if(!run.showedMethod&&auto!==true){run.showedMethod=true;run.aides++;}}
  $("methBtn").textContent=b.hidden?"Voir la méthode":"Cacher la méthode";
}
function validate(){
  if(run.locked){next();return;}
  const q=run.qs[run.i];let res,chosen=null;
  if(q.type==="num"){
    if(isExpr($("ans").value)){$("fbBox").innerHTML=`<p class="status ko">Écris un nombre. Pour calculer, utilise la calculatrice : le résultat s'inscrit tout seul dans ta réponse.</p>`;return;}
    const v=evalAns($("ans").value);run.typed=$("ans").value;
    if(isNaN(v)){$("fbBox").innerHTML=`<p class="status ko">Écris un nombre avant de valider.</p>`;return;}
    res=judgeNum(q,v);
    if(!res.ok&&!run.second){
      run.second=true;showMethod(true);
      $("fbBox").innerHTML=`<div class="fb retry" role="status"><div class="verdict">Pas encore : deuxième essai</div>
        ${res.msg?`<p>${res.msg}</p>`:"<p>Relis la méthode ci-dessus, refais ton calcul et valide à nouveau.</p>"}</div>`;
      $("valid").textContent="Valider mon deuxième essai";$("ans").select();return;
    }
    $("ans").disabled=true;
  }else{
    const c=app().querySelector('input[name="qc"]:checked');
    if(!c){$("fbBox").innerHTML=`<p class="status ko">Choisis une réponse avant de valider.</p>`;return;}
    chosen=+c.value;res={ok:chosen===q.correct};
    app().querySelectorAll('input[name="qc"]').forEach(x=>x.disabled=true);
    $("opt"+q.correct).classList.add("good");if(!res.ok)$("opt"+chosen).classList.add("bad");
  }
  run.locked=true;run.res.push(res.ok?(run.second?2:1):0);if(res.ok&&run.second)run.secondes=(run.secondes||0)+1;
  const dt=(Date.now()-run.qStart)/1000;S.act.times.push(Math.round(dt));
  if(dt<(q.type==="num"?8:3))S.act.rapides++;
  if(run.outDuring)S.act.apresSortie++;
  save();
  const ansTxt=q.type==="num"?`<span class="l">Réponse attendue : <b>${q.show||fs(q.ans,q.sig||3)} ${q.unit==="(sans unité)"?"":q.unit}</b></span>`:"";
  $("fbBox").innerHTML=`<div class="fb ${res.ok?"ok":"ko"}" role="status"><div class="verdict">${res.ok?(run.second?"Bonne réponse au deuxième essai":"Bonne réponse"):"Ce n'est pas la bonne réponse"}</div>
    ${res.msg?`<p>${res.msg}</p>`:""}<div class="corr">${res.ok?"":ansTxt}${q.corr}</div></div>`;
  if(res.ok&&q.type==="num"&&isExpr(run.typed)){$("fbBox").querySelector(".fb").insertAdjacentHTML("beforeend",`<p class="cswarn">Ton calcul est juste. Sur ta copie, écris ensuite le résultat ${q.sig&&!q.noSig?`arrondi à ${q.sig} chiffres significatifs`:"arrondi"} : ${q.show||fs(q.ans,q.sig||3)}${q.unit==="(sans unité)"?"":" "+q.unit}.</p>`);}
  else if(res.ok&&q.type==="num"&&q.sig&&!q.noSig&&cs(run.typed)!==q.sig){$("fbBox").querySelector(".fb").insertAdjacentHTML("beforeend",`<p class="cswarn">Ta valeur est juste, mais tu l'as écrite avec ${cs(run.typed)} chiffre${cs(run.typed)>1?"s":""} significatif${cs(run.typed)>1?"s":""}. Il en faut ${q.sig} : ${fs(q.ans,q.sig)} ${q.unit}.</p>`);run.csErr=(run.csErr||0)+1;}
  const b=$("valid");b.textContent=run.i===run.qs.length-1?"Voir mon score":"Question suivante";b.focus();
}
function next(){run.i++;if(run.i>=run.qs.length)finish();else{renderQ();window.scrollTo(0,0);}}
function finish(){
  const {k}=run;const ok=run.res.filter(Boolean).length;const m=S.missions[k];
  m.last=ok;m.best=Math.max(m.best??0,ok);m.aides+=run.aides;m.secondes=(m.secondes||0)+(run.secondes||0);m.csErr=(m.csErr||0)+(run.csErr||0);m.ratees=run.qs.filter((q,j)=>!run.res[j]).map(q=>q.id);const win=ok>=passOf(k);if(win)m.reussie=true;save();applyUI();
  const all=S.missions.every(x=>x.reussie);
  app().innerHTML=`<div class="card" style="display:grid;gap:14px;max-width:640px">
    <span class="mnum">Mission ${k+1} · ${MISSIONS[k].t}</span>
    <div class="score">${ok}/${nq(k)}</div>
    <h2>${win?"Mission réussie":"Encore un essai"}</h2>
    <p>${win?(all?"Toutes les missions sont réussies. Tes résultats partent chez ton professeur.":"La mission suivante est ouverte."):`Il faut au moins ${passOf(k)} bonnes réponses sur ${nq(k)}. Relis l'encadré « À retenir » et utilise la méthode : les nouvelles questions auront d'autres valeurs.`}</p>
    <p id="sendStatus" class="status" hidden></p>
    <div class="row">${win?"":`<button class="btn" id="again">Recommencer la mission</button>`}<button class="btn${win?"":" ghost"}" id="home">Retour aux missions</button></div></div>`;
  run=null;
  $("home").addEventListener("click",renderHome);
  if($("again"))$("again").addEventListener("click",()=>startMission(k));
  if(all&&!S.autoSent){S.autoSent=true;save();sendResults(true);}
}

/* ================== Envoi des résultats ================== */
function payload(){
  const tot=MISSIONS.reduce((s,mi)=>s+mi.plan.length,0);const ok=S.missions.reduce((s,m)=>s+(m.best||0),0);
  const p={prenom:S.eleve.prenom,nom:S.eleve.nom,initiale:S.eleve.nom,classe:S.eleve.classe,jeu:JEU,
    pct:Math.round(ok/tot*100),ok,tot,
    missions:MISSIONS.map((mi,k)=>{const m=S.missions[k];return {mission:k+1,titre:mi.t,ok:m.best||0,tot:nq(k),pct:Math.round((m.best||0)/nq(k)*100),reussie:m.reussie,tentatives:m.tentatives,aidesMethode:m.aides,reussiesDeuxiemeEssai:m.secondes||0,erreursChiffresSignificatifs:m.csErr||0,questionsRateesDernierEssai:m.ratees||[]};}),
    activite:{sortiesPage:S.act.sorties,tempsHorsPage:Math.round(S.act.horsMs/1000),copies:S.act.copies,tempsMedian:median(S.act.times),reponsesRapides:S.act.rapides,reponsesApresSortie:S.act.apresSortie,nbReponses:S.act.times.length}};
  if(TEST)p.test=true;
  return p;
}
function setStatus(cls,txt){const el=$("sendStatus");if(!el)return;el.hidden=false;el.className="status "+cls;el.textContent=txt;}
function sendResults(auto){
  if(!S.eleve)return;
  setStatus("wait","Envoi en cours…");
  fetch(WORKER,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload())})
   .then(r=>{if(!r.ok)throw new Error(r.status);
     S.envoi=new Date().toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});save();
     setStatus("ok","Résultats envoyés au professeur ("+S.envoi+").");})
   .catch(()=>{if(auto)S.autoSent=false;save();setStatus("ko","L'envoi n'a pas fonctionné. Vérifie la connexion puis appuie sur « Envoyer mes résultats » depuis la page des missions.");});
}


/* ================== Calculatrice ================== */
let calcExpr="", calcHist="", calcLast=null;
const CKEYS=[["(","op"],[")","op"],["⌫","op"],["C","op"],["7"],["8"],["9"],["÷","op"],["4"],["5"],["6"],["×","op"],["1"],["2"],["3"],["−","op"],["0"],[","],["×10ⁿ","op"],["+","op"]];
function calcHTML(){
  return `<section class="calc" aria-label="Calculatrice"><h3>Calculatrice</h3>
   <div class="cdisp"><div class="hist" id="cHist">${esc(calcHist)}</div><input id="cIn" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Calcul" placeholder="0" value="${esc(calcExpr)}"></div>
   <p class="cerr" id="cErr" aria-live="polite"></p><p class="cinfo" id="cInfo" aria-live="polite"></p>
   <div class="ckeys">${CKEYS.map(([k,c])=>`<button type="button" class="ck ${c||""}" data-k="${k}" aria-label="${{"⌫":"Effacer le dernier caractère","C":"Tout effacer","×10ⁿ":"fois dix puissance","−":"moins","÷":"divisé par","×":"fois"}[k]||k}">${k}</button>`).join("")}
    <button type="button" class="ck eq" data-k="=" aria-label="Égal : calculer et écrire le résultat dans ma réponse">=</button></div>
   <p class="small muted" style="margin:0">Appuie sur = : le résultat s'écrit dans ta réponse. ×10ⁿ écrit E (2,5E−3 = 2,5 × 10<sup>−3</sup>).</p></section>`;
}
function calcEval(src){
  const t=src.replace(/\s+/g,"").replace(/,/g,".").replace(/[−–]/g,"-").replace(/×/g,"*").replace(/÷/g,"/").replace(/[xX]/g,"*").replace(/:/g,"/");
  let i=0;
  const peek=()=>t[i];
  function num(){const m=t.slice(i).match(/^(\d+\.?\d*|\.\d+)(E[-+]?\d+)?/i);if(!m)throw 0;i+=m[0].length;return parseFloat(m[0]);}
  function prim(){if(peek()==="("){i++;const v=expr();if(peek()!==")")throw 0;i++;return v;}if(peek()==="-"){i++;return -prim();}if(peek()==="+"){i++;return prim();}return num();}
  function pow(){const b=prim();if(peek()==="^"){i++;return Math.pow(b,pow());}return b;}
  function term(){let v=pow();while(peek()==="*"||peek()==="/"){const o=t[i++];const w=pow();v=o==="*"?v*w:v/w;}return v;}
  function expr(){let v=term();while(peek()==="+"||peek()==="-"){const o=t[i++];const w=term();v=o==="+"?v+w:v-w;}return v;}
  if(!t)throw 0;const v=expr();if(i<t.length||!isFinite(v))throw 0;return v;
}
function calcFmt(v){
  if(v===0)return "0";const a=Math.abs(v);
  if(a>=1e-3&&a<1e9)return String(+v.toPrecision(10)).replace(".",",");
  const [m,e]=v.toExponential(6).split("e");return String(+m).replace(".",",")+"E"+(+e<0?"−"+(-e):+e);
}
function toAnswer(v){
  const a=$("ans"),info=$("cInfo");if(info)info.textContent="";
  if(!a||a.disabled)return;
  a.value=calcFmt(v).replace("−","-");
  const box=a.closest(".lcd");box.classList.remove("flash");void box.offsetWidth;box.classList.add("flash");
  if(info)info.textContent="Résultat écrit dans ta réponse : arrondis-le si besoin, puis valide.";
  const r=box.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)box.scrollIntoView({block:"center",behavior:"smooth"});
}
function bindCalc(){
  const inp=$("cIn"),err=$("cErr");
  const set=v=>{calcExpr=v;inp.value=v;};
  const run_=()=>{err.textContent="";try{const v=calcEval(inp.value);calcHist=inp.value+" =";calcLast=v;$("cHist").textContent=calcHist;set(calcFmt(v));toAnswer(v);}catch(e){err.textContent="Calcul impossible : vérifie les parenthèses et les opérations.";}};
  inp.addEventListener("input",()=>{calcExpr=inp.value;});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.stopPropagation();run_();}});
  document.querySelectorAll(".ck").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.k;err.textContent="";
    if(k==="=")return run_();
    if(k==="C"){set("");calcHist="";calcLast=null;$("cHist").textContent="";return;}
    if(k==="⌫")return set(inp.value.slice(0,-1));
    if(k==="ans"){
      const a=$("ans");if(!a||a.disabled){err.textContent=a?"La question est déjà validée.":"Cette question se répond en choisissant une case.";return;}
      let v;try{v=calcEval(inp.value);}catch(e){err.textContent="Fais d'abord un calcul valide.";return;}
      a.value=calcFmt(v).replace("−","-");a.focus();return;
    }
    set(inp.value+(k==="×10ⁿ"?"E":k));
  }));
}


/* ================== Réponse : nombre ou calcul ================== */
const unitStrip = t => String(t).trim().replace(/\s*(g\/mol|g\/L|mol\/L|mmol|mol|mg|mL|L|g)\s*$/i,"");
function isExpr(t){
  let x=unitStrip(t).replace(/\s+/g,"").replace(/[−–]/g,"-");
  x=x.replace(/^[-+]/,"").replace(/[x×*]10\^?\(?[-+]?\d+\)?$/i,"").replace(/e[-+]?\d+$/i,"");
  return /[-+*\/×÷:xX^()]/.test(x);
}
function evalAns(t){
  const u=unitStrip(t);
  if(!u.trim()) return NaN;
  try{ return calcEval(u.replace(/[xX]/g,"×")); }catch(e){ return isExpr(u)?NaN:parseNum(u); }
}
function ansPreview(){
  const el=$("ansPrev"),t=$("ans").value;if(!el)return;
  if(!isExpr(t)){el.textContent="";return;}
  const v=evalAns(t);
  el.textContent=isNaN(v)?"Calcul incomplet ou mal écrit.":"Résultat du calcul : "+calcFmt(v).replace("E","×10^");
}

/* ================== Lecture à voix haute ================== */
function speak(el){
  try{
    if(speechSynthesis.speaking){speechSynthesis.cancel();return;}
    let t=el.innerText.split("\nValider")[0];
    t=t.replace(/g\/mol/g," grammes par mole").replace(/g\/L/g," grammes par litre").replace(/mol\/L/g," moles par litre")
       .replace(/\bmL\b/g," millilitres").replace(/\bmmol\b/g," millimoles").replace(/\bmg\b/g," milligrammes")
       .replace(/×/g," fois ").replace(/\//g," divisé par ").replace(/\bM\(/g,"M de (");
    const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.92;speechSynthesis.speak(u);
  }catch(e){}
}

/* ================== Démarrage ================== */
function init(){
  load();
  document.addEventListener("visibilitychange",()=>document.hidden?goOut():comeBack());
  window.addEventListener("blur",goOut);window.addEventListener("focus",comeBack);
  document.addEventListener("copy",()=>{S.act.copies++;save();});
  $("fsMinus").addEventListener("click",()=>{S.ui.fs=Math.max(14,S.ui.fs-1);save();applyUI();});
  $("fsPlus").addEventListener("click",()=>{S.ui.fs=Math.min(26,S.ui.fs+1);save();applyUI();});
  $("easeBtn").addEventListener("click",()=>{S.ui.ease=!S.ui.ease;save();applyUI();});
  renderHome();
}
if(typeof window!=="undefined"&&typeof document!=="undefined") init();
</script>
